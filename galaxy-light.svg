<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="39 stars: every repository of Forichok, oldest in the centre">
<style>
.s{fill:#1b2a4a;opacity:0;animation:appear .5s ease-out forwards}
.fork{fill:none;stroke:#1b2a4a;stroke-width:1}
.tw{animation:appear .5s ease-out forwards,twinkle 4s ease-in-out infinite}
.path{fill:none;stroke:#1b2a4a;stroke-opacity:.32;stroke-width:1;stroke-dasharray:6000;stroke-dashoffset:6000;animation:draw 4.2s cubic-bezier(.5,0,.3,1) .3s forwards}
.halo{opacity:0;animation:nova 1.4s ease-out forwards}
.ring{fill:none;stroke:#7aa7ff;stroke-width:1.2;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out 4.6s infinite}
.lbl{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2328;paint-order:stroke;stroke:#fbfcfe;stroke-width:5px;stroke-linejoin:round;opacity:0;animation:appear .6s ease-out forwards}
.lbl.m{fill:#59636e}
.shoot{stroke:url(#sh);stroke-width:1.4;stroke-linecap:round;opacity:0;animation:shoot 11s linear 6s infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes appear{to{opacity:1}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes nova{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.15)}100%{opacity:.85;transform:scale(1)}}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
@keyframes shoot{0%{opacity:0;transform:translate(0,0)}1%{opacity:1}6%{opacity:0;transform:translate(-220px,90px)}100%{opacity:0;transform:translate(-220px,90px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
